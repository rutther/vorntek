server {
    listen 8080;
    server_name _;
    # ``current`` is a controlled relative symlink replaced atomically by the
    # deployment adapter.  The website container mounts this store read-only.
    root /srv/website/current;
    index index.html;
    server_tokens off;
    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /srv/crm-static/;
    }
    location ~ ^/(admin/|api/|healthz/|console/) {
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
