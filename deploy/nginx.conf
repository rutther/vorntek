log_format privacy_minimal escape=json
    '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    # ``current`` is a controlled relative symlink replaced atomically by the
    # deployment adapter.  The website container mounts this store read-only.
    root /srv/website/current;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log privacy_minimal;
    # Public APIs and ordinary forms stay small. Exact authenticated upload
    # routes below are raised only to one MiB above their application limit so
    # multipart framing does not make supported files unreachable.
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /srv/crm-static/;
    }

    location = /admin/assets/upload/ {
        client_max_body_size 129m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location = /admin/api/sales/attachments/ {
        client_max_body_size 51m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location ~ ^/admin/api/sales/whatsapp/[0-9]+/send/$ {
        client_max_body_size 26m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location = /admin/articles/import/ {
        client_max_body_size 17m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location = /admin/sales/customer-pool/import/ {
        client_max_body_size 11m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location = /admin/articles/new/ {
        client_max_body_size 9m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location ~ ^/admin/articles/[0-9]+/$ {
        client_max_body_size 9m;
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location ~ ^/(admin/|api/|healthz/|console/) {
        proxy_pass http://crm:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
