<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}-title" aria-describedby="{{ modal_id }}-description" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><form class="modal-content" action="{% url 'console:activity_create' %}" method="post" data-nc-task-form="activity" novalidate>
    {% csrf_token %}<input type="hidden" name="idempotency_token" value=""><input type="hidden" name="target_type" value="{{ target_type }}"><input type="hidden" name="target_id" value="{{ target_id }}">
    <div class="modal-header"><div><h2 class="modal-title" id="{{ modal_id }}-title">记录活动</h2><p id="{{ modal_id }}-description">{{ target_label }} · 只记录已经发生的沟通证据，不代替未来任务。</p></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
    <div class="modal-body"><div class="alert alert-danger" data-nc-form-error hidden></div><div class="row g-3">
        <div class="col-6 col-md-3"><label class="form-label" for="{{ modal_id }}-type">类型</label><select class="form-select" id="{{ modal_id }}-type" name="activity_type"><option value="note">跟进记录</option><option value="call">电话</option><option value="email">邮件</option><option value="whatsapp">WhatsApp</option><option value="meeting">会议</option><option value="site_visit">现场拜访</option></select></div>
        <div class="col-6 col-md-3"><label class="form-label" for="{{ modal_id }}-direction">方向</label><select class="form-select" id="{{ modal_id }}-direction" name="direction"><option value="outbound">出站</option><option value="inbound">入站</option><option value="internal">内部</option></select></div>
        <div class="col-12 col-md-6"><label class="form-label" for="{{ modal_id }}-occurred">发生时间</label><input class="form-control" id="{{ modal_id }}-occurred" type="datetime-local" name="occurred_at" data-nc-activity-occurred required><div class="invalid-feedback" data-error-for="occurred_at"></div></div>
        <div class="col-12"><label class="form-label" for="{{ modal_id }}-subject">主题</label><input class="form-control" id="{{ modal_id }}-subject" name="subject" maxlength="240" required><div class="invalid-feedback" data-error-for="subject"></div></div>
        <div class="col-12"><label class="form-label" for="{{ modal_id }}-body">活动内容</label><textarea class="form-control" id="{{ modal_id }}-body" name="body" rows="5" maxlength="8000" required placeholder="客户反馈、已完成的动作与重要事实"></textarea><div class="invalid-feedback" data-error-for="body"></div></div>
    </div><div class="alert mt-3 mb-0" data-nc-form-status role="status" aria-live="polite" hidden></div></div>
    <div class="modal-footer"><button class="btn btn-ghost-secondary" type="button" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit" data-nc-submit><span>保存活动证据</span></button></div>
</form></div></div>
