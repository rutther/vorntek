<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}-title" aria-describedby="{{ modal_id }}-description" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><form class="modal-content" action="{{ action_url }}" method="post" data-nc-task-form="opportunity-create" novalidate>
    {% csrf_token %}<input type="hidden" name="idempotency_token" value=""><input type="hidden" name="company_id" value="{{ company_id }}">
    <div class="modal-header"><div><h2 class="modal-title" id="{{ modal_id }}-title">新建销售机会</h2><p id="{{ modal_id }}-description">{{ company_label }} · 仅创建内部销售记录，不发送消息，也不触发营销事件。</p></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
    <div class="modal-body"><div class="alert alert-danger" data-nc-form-error hidden></div><div class="row g-3">
        <div class="col-12"><label class="form-label" for="{{ modal_id }}-name">项目名称</label><input class="form-control" id="{{ modal_id }}-name" name="name" maxlength="240" required><div class="invalid-feedback" data-error-for="name"></div></div>
        <div class="col-12 col-md-4"><label class="form-label" for="{{ modal_id }}-owner">负责人</label><select class="form-select" id="{{ modal_id }}-owner" name="owner_user" required>{% for item in owner_choices %}{% if item.is_active %}<option value="{{ item.value }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>{% endif %}{% endfor %}</select><div class="invalid-feedback" data-error-for="owner_user"></div></div>
        <div class="col-7 col-md-4"><label class="form-label" for="{{ modal_id }}-amount">预计金额</label><input class="form-control" id="{{ modal_id }}-amount" name="value_amount" type="number" min="0" step="0.01" inputmode="decimal"><div class="invalid-feedback" data-error-for="value_amount"></div></div>
        <div class="col-5 col-md-2"><label class="form-label" for="{{ modal_id }}-currency">币种</label><input class="form-control text-uppercase" id="{{ modal_id }}-currency" name="currency" value="USD" minlength="3" maxlength="3" required><div class="invalid-feedback" data-error-for="currency"></div></div>
        <div class="col-12 col-md-2"><label class="form-label" for="{{ modal_id }}-probability">成交概率 %</label><input class="form-control" id="{{ modal_id }}-probability" name="probability" type="number" min="0" max="100" value="10" required><div class="invalid-feedback" data-error-for="probability"></div></div>
        <div class="col-12 col-md-6"><label class="form-label" for="{{ modal_id }}-product">产品范围</label><input class="form-control" id="{{ modal_id }}-product" name="product_scope" maxlength="2000"><div class="invalid-feedback" data-error-for="product_scope"></div></div>
        <div class="col-12 col-md-3"><label class="form-label" for="{{ modal_id }}-capacity">产能目标</label><input class="form-control" id="{{ modal_id }}-capacity" name="capacity_target" maxlength="2000"></div>
        <div class="col-12 col-md-3"><label class="form-label" for="{{ modal_id }}-packaging">包装形式</label><input class="form-control" id="{{ modal_id }}-packaging" name="packaging_format" maxlength="2000"></div>
        <div class="col-12"><label class="form-label" for="{{ modal_id }}-next-step">下一步</label><textarea class="form-control" id="{{ modal_id }}-next-step" name="next_step" rows="3" maxlength="2000"></textarea></div>
        <div class="col-12 col-md-6"><label class="form-label" for="{{ modal_id }}-follow-up">下次跟进时间</label><input class="form-control" id="{{ modal_id }}-follow-up" name="next_follow_up_at" type="datetime-local"><div class="invalid-feedback" data-error-for="next_follow_up_at"></div></div>
        <div class="col-12 col-md-6"><label class="form-label" for="{{ modal_id }}-close-date">预计成交日期</label><input class="form-control" id="{{ modal_id }}-close-date" name="expected_close_date" type="date"><div class="invalid-feedback" data-error-for="expected_close_date"></div></div>
    </div><div class="alert mt-3 mb-0" data-nc-form-status role="status" aria-live="polite" hidden></div></div>
    <div class="modal-footer"><button class="btn btn-ghost-secondary" type="button" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit" data-nc-submit><span>创建销售机会</span></button></div>
</form></div></div>
