<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}-title" aria-describedby="{{ modal_id }}-description" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><form class="modal-content" action="{% url 'console:task_create' %}" method="post" data-nc-task-form="create-context" novalidate>
    {% csrf_token %}<input type="hidden" name="idempotency_token" value=""><input type="hidden" name="target_type" value="{{ target_type }}"><input type="hidden" name="target_id" value="{{ target_id }}">
    <div class="modal-header"><div><h2 class="modal-title" id="{{ modal_id }}-title">新建任务</h2><p id="{{ modal_id }}-description">{{ target_label }} · 关联对象和团队已经锁定，请明确下一行动与负责人。</p></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
    <div class="modal-body"><div class="alert alert-danger" data-nc-form-error hidden></div><div class="row g-3">
        <div class="col-12"><label class="form-label" for="{{ modal_id }}-task-title">任务标题</label><input class="form-control" id="{{ modal_id }}-task-title" name="title" maxlength="240" required><div class="invalid-feedback" data-error-for="title"></div></div>
        <div class="col-12"><label class="form-label" for="{{ modal_id }}-task-description">说明</label><textarea class="form-control" id="{{ modal_id }}-task-description" name="description" rows="3" maxlength="4000"></textarea></div>
        <div class="col-6 col-md-3"><label class="form-label" for="{{ modal_id }}-task-type">类型</label><select class="form-select" id="{{ modal_id }}-task-type" name="task_type"><option value="follow_up">跟进</option><option value="call">电话</option><option value="email">邮件</option><option value="whatsapp">WhatsApp</option><option value="meeting">会议</option><option value="quote">报价</option><option value="review">内部评审</option><option value="other">其他</option></select></div>
        <div class="col-6 col-md-3"><label class="form-label" for="{{ modal_id }}-task-priority">优先级</label><select class="form-select" id="{{ modal_id }}-task-priority" name="priority"><option value="urgent">紧急</option><option value="high">高</option><option value="normal" selected>普通</option><option value="low">低</option></select></div>
        <div class="col-12 col-md-3"><label class="form-label" for="{{ modal_id }}-task-due">到期时间</label><input class="form-control" id="{{ modal_id }}-task-due" type="datetime-local" name="due_at" required><div class="invalid-feedback" data-error-for="due_at"></div></div>
        <div class="col-12 col-md-3"><label class="form-label" for="{{ modal_id }}-task-owner">负责人</label><select class="form-select" id="{{ modal_id }}-task-owner" name="owner_user" required>{% for item in owner_choices %}{% if item.is_active %}<option value="{{ item.value }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>{% endif %}{% endfor %}</select><div class="invalid-feedback" data-error-for="owner_user"></div></div>
    </div><div class="alert mt-3 mb-0" data-nc-form-status role="status" aria-live="polite" hidden></div></div>
    <div class="modal-footer"><button class="btn btn-ghost-secondary" type="button" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit" data-nc-submit><span>创建任务</span></button></div>
</form></div></div>
