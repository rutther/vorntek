name: Candidate validation

'on':
  push:
    branches: [main]
    tags: ['v0.2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-09-12
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-09-12
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-09-12
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install declared dependencies
        run: python -m pip install -r apps/crm/requirements.lock -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Python dependency vulnerability audit
        run: python -m pip_audit -r apps/crm/requirements.lock --progress-spinner off
      - name: Distribution and private recovery guards
        run: python -m unittest discover -s tests -v
      - name: Candidate Git history audit since the trusted RC1 tag
        run: python scripts/audit_release_history.py --base v0.1.0-rc.1 --require-clean --asset-allowlist docs/review/release-asset-allowlist.json
      - name: Deterministic source release manifest
        run: python scripts/release_manifest.py --require-clean
      - name: Browser script contracts (no real platform requests)
        run: |
          npm ci --prefix apps/crm/flow-ui --no-audit --no-fund
          npm audit --prefix apps/crm/flow-ui --audit-level=moderate
          node --test scripts/test_measurement.mjs scripts/test_website_pixel_runtime.mjs scripts/test_form_status.mjs scripts/test_credential_receipt.mjs scripts/test_vorntek_form.mjs scripts/test_configured_inquiry.mjs scripts/test_corporate_interactions.mjs scripts/test_three_d_camera.mjs scripts/test_three_d_load_state.mjs scripts/test_three_d_preview_config.mjs
      - name: Complete guided-loop interactions and source build
        working-directory: apps/crm/flow-ui
        run: |
          npm test
          npm run build
      - name: Complete synthetic SQLite compatibility regression
        run: python scripts/run_application_tests.py

  postgres-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-09-12
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-09-12
        with:
          python-version: '3.12.12'
      - name: Install application dependencies
        run: python -m pip install -r apps/crm/requirements.lock
      - name: PostgreSQL 18 from the official package repository (ephemeral runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo install -m 0644 deploy/ci/pgdg.sources /etc/apt/sources.list.d/newcrown-ci-pgdg.sources
          sudo apt-get update
          sudo apt-get install -y postgresql-18
      - name: Isolated PostgreSQL lifecycle and website-to-CRM HTTP
        run: |
          git worktree add --detach "$RUNNER_TEMP/vorntek-public-main" 6d3eefe7e5e124c31d175a1bfc971b58dd197082
          python scripts/test_release_upgrade.py --baseline-checkout "$RUNNER_TEMP/vorntek-public-main" --candidate-checkout . --pg-bin /usr/lib/postgresql/18/bin
      - name: Generate synthetic installation configuration
        run: python scripts/configure.py
      - name: Validate and build all images without publication
        run: |
          docker compose config --quiet
          docker compose build
          docker compose --profile maintenance build maintenance
      - name: Start only this ephemeral candidate stack
        run: docker compose up -d
      - name: Check real container entrypoints and default-disabled measurement
        run: python scripts/check_local_stack.py --url http://127.0.0.1:8088/ --wait-seconds 180
      - name: Read-only release and migration preflight
        run: docker compose exec -T crm python manage.py release_preflight --strict
      - name: Synthetic website deployment lifecycle through the real shared volume
        run: |
          docker compose exec -T -e NEWCROWN_SYNTHETIC_ACCEPTANCE=1 crm \
            python manage.py run_synthetic_website_deployment_acceptance \
              --synthetic-only --expect-database newcrown --require-bundled-baseline
          curl --fail --silent --show-error \
            http://127.0.0.1:8088/articles/acceptance-guide/ \
            | grep --fixed-strings 'Synthetic deployment marker'
          docker compose restart crm website
          python scripts/check_local_stack.py --url http://127.0.0.1:8088/ --wait-seconds 180
          curl --fail --silent --show-error \
            http://127.0.0.1:8088/articles/acceptance-guide/ \
            | grep --fixed-strings 'Synthetic deployment marker'
      - name: Check maintenance entrypoints without accessing business records
        run: |
          sudo install -d -m 0700 -o 10001 -g 10001 ./backups
          docker compose run --rm --no-deps maintenance --help
          docker compose run --rm --no-deps filebackup --help
          docker compose run --rm --no-deps filerestore --help
      - name: Export worker handles actual container SIGTERM
        run: |
          docker compose stop exports
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q exports)")" = "0"
          docker compose up -d --no-deps exports
      - name: Show bounded container diagnostics without environment values
        if: always()
        run: |
          docker compose ps -a
          crm_container="$(docker compose ps -a -q crm)"
          if [ -n "$crm_container" ]; then
            docker inspect --format '{{json .State.Health}}' "$crm_container" || true
          fi
          docker compose logs --no-color --tail 200 db initialize crm scheduler website || true
      - name: Stop only this disposable runner's project (keep volumes until runner disposal)
        if: always()
        run: docker compose down

# Deliberately no deployment, registry login, artifact upload, repository write,
# secrets context, pull_request_target or persistent self-hosted runner.
