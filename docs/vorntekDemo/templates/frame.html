<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-title-en="$title_en" data-title-zh="$title_zh">$title_en</title>
  <meta name="description" content="$description_en" data-en="$description_en" data-zh="$description_zh">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:title" content="$title_en" data-en="$title_en" data-zh="$title_zh">
  <meta property="og:description" content="$description_en" data-en="$description_en" data-zh="$description_zh">
  <meta property="og:type" content="website"><meta property="og:image" content="$og_image">
  <link rel="icon" href="/assets/vorntek/vorntekLogo.png">
  <link rel="stylesheet" href="/styles.css?v=$css_hash">
  <script defer src="/assets/meta-pixel.js?v=$pixel_hash"></script>
  <script defer src="/app.js?v=$app_hash"></script>
  <script defer src="/inquiry-form.js?v=$form_hash"></script>
$extra_head
</head>
<body>
  <a class="skip" href="#main">$skip</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Vorntek home"><img src="/assets/vorntek/vorntekLogo.png" alt="Vorntek" width="185" height="34"></a>
    <button class="menu-button" aria-expanded="false" aria-controls="site-nav">$menu</button>
    <nav id="site-nav" aria-label="Primary navigation">$navigation</nav>
    <div class="header-actions"><select id="language" aria-label="Language"><option value="en">EN</option><option value="zh">中文</option></select><a class="button primary header-cta" href="/contact/">$contact_action $arrow</a></div>
  </header>
  <main id="main">$body</main>
  <footer class="site-footer">
    <div class="footer-main"><a class="brand" href="/"><img src="/assets/vorntek/vorntekLogo.png" alt="Vorntek" width="185" height="34"></a><p>$brand_description</p><a class="text-link" href="/contact/">$contact_action $arrow</a></div>
    <div class="footer-navigation">$footer_navigation</div>
    <div class="footer-bottom footer-links"><span>© Vorntek</span><a href="/privacy/">$privacy</a><button type="button" data-privacy-settings>$privacy_choices</button><a href="/demo/">$demo</a><a href="/admin/">$staff</a></div>
  </footer>
</body></html>
